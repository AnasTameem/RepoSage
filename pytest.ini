[pytest]
asyncio_mode = auto
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
norecursedirs = cloned-repo .venv scratch .git
timeout = 60
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    smoke: Fast smoke tests with no LLM judge
    deepeval: DeepEval metric-based regression tests (require GEMINI_API_KEY)
    ragas: Ragas evaluation tests
    offline: Fast offline unit tests running without live database/API keys

